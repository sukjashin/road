<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>도로결빙 위험구간 관측 지도</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --bg:#eef1f6;
    --card:#ffffff;
    --navy:#1c2b4a;
    --navy-soft:#33456b;
    --accent:#2f6fed;
    --accent-soft:#eaf1ff;
    --danger:#e6484f;
    --danger-soft:#fdeceb;
    --warn:#f0a93e;
    --warn-soft:#fdf3e3;
    --safe:#2fb872;
    --safe-soft:#e8f8ef;
    --muted:#7d8aa0;
    --border:#e6e9f0;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    background:var(--bg);
    color:var(--navy);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
  }
  .page{ max-width:1280px; margin:0 auto; padding:20px 20px 40px 20px; }

  .top-bar{
    background:var(--navy);
    border-radius:14px;
    padding:16px 22px;
    margin-bottom:18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-badge{
    width:10px;height:28px;background:var(--accent);border-radius:3px;flex-shrink:0;
  }
  .brand-title{ color:#fff; font-size:17px; font-weight:800; letter-spacing:-0.01em; }
  .brand-sub{ color:#9fb0d0; font-size:12px; margin-top:2px; }
  .update-time{
    color:#cfe0ff; font-size:13px; font-weight:600;
    background:#26375c; padding:6px 12px; border-radius:8px;
  }

  /* 결빙/폭염 모드 전환 */
  .mode-toggle{ display:flex; gap:4px; background:#26375c; border-radius:10px; padding:4px; }
  .mode-btn{
    font-family:inherit; font-size:12.5px; font-weight:700; color:#9fb0d0;
    background:transparent; border:none; border-radius:7px; padding:6px 12px; cursor:pointer;
  }
  .mode-btn:hover{ color:#fff; }
  .mode-btn.active{ background:var(--accent); color:#fff; }

  /* 파일 추가/실행 메뉴 */
  .file-bar{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px 18px;
    margin-bottom:18px;
    box-shadow:0 2px 10px rgba(28,43,74,0.05);
  }
  .file-controls{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .file-btn, .run-btn, .reset-btn{
    font-family:inherit; font-size:12.5px; font-weight:700;
    border-radius:8px; padding:8px 14px; cursor:pointer; border:none;
  }
  .file-btn{ background:var(--accent-soft); color:var(--accent); }
  .file-btn:hover{ background:#dde9ff; }
  .run-btn{ background:var(--accent); color:#fff; }
  .run-btn:disabled{ background:var(--border); color:var(--muted); cursor:not-allowed; }
  .run-btn:not(:disabled):hover{ background:#2159c9; }
  .reset-btn{ background:#fff; color:var(--muted); border:1px solid var(--border) !important; }
  .reset-btn:hover{ color:var(--navy-soft); border-color:var(--navy-soft) !important; }
  .file-hint{ font-size:11px; color:var(--muted); margin-left:2px; }
  .file-chips{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .file-chip{
    display:flex; align-items:center; gap:8px;
    background:var(--accent-soft); color:var(--navy-soft);
    font-size:11.5px; font-weight:600;
    padding:6px 10px; border-radius:20px;
  }
  .file-chip.applied{ background:var(--safe-soft); color:#1f8a53; }
  .file-chip.error{ background:var(--danger-soft); color:var(--danger); }
  .file-chip .chip-x{
    cursor:pointer; font-weight:800; color:var(--muted); line-height:1;
    width:14px; height:14px; display:flex; align-items:center; justify-content:center;
  }
  .file-chip .chip-x:hover{ color:var(--danger); }
  .file-chip .chip-name{ white-space:nowrap; }
  .file-chip .chip-loc{
    font-family:inherit; font-size:11.5px; font-weight:600; color:var(--navy-soft);
    background:#ffffffa0; border:1px solid transparent; border-radius:10px;
    padding:2px 8px; width:110px;
  }
  .file-chip .chip-loc::placeholder{ color:#9aa8bf; font-weight:500; }
  .file-chip .chip-loc:focus{ outline:none; border-color:var(--accent); background:#fff; }
  .file-status{ font-size:11.5px; color:var(--muted); margin-top:8px; min-height:14px; }

  /* 임계값 설정 / 시간 재생 / 내보내기 도구모음 */
  .tools-bar{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px 18px;
    margin-bottom:18px;
    box-shadow:0 2px 10px rgba(28,43,74,0.05);
    display:flex;
    align-items:flex-start;
    gap:24px;
    flex-wrap:wrap;
  }
  .tool-group{ display:flex; flex-direction:column; gap:6px; }
  .tool-group[hidden]{ display:none; }
  .tool-group.grow{ flex:1; min-width:220px; }
  .tool-label{ font-size:11px; color:var(--muted); font-weight:700; }
  .tool-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .tool-row label{ font-size:11.5px; color:var(--navy-soft); font-weight:600; display:flex; align-items:center; gap:4px; }
  .th-input{
    width:56px; font-family:inherit; font-size:12px; font-weight:700; color:var(--navy);
    border:1px solid var(--border); border-radius:6px; padding:4px 6px;
  }
  .time-slider{ flex:1; min-width:160px; accent-color:var(--accent); }
  .time-slider:disabled{ opacity:0.4; }
  #timeLabel{ color:var(--navy); font-weight:800; }
  .export-btn{ background:var(--navy); white-space:nowrap; }
  .export-btn:hover{ background:var(--navy-soft); }
  .status-dot.blue{ background:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }

  @media print{
    .file-bar, .tools-bar, .leaflet-control-layers, .leaflet-control-zoom{ display:none !important; }
    .page{ max-width:100%; padding:0; }
  }

  .dashboard{
    display:grid;
    grid-template-columns: 380px 1fr;
    gap:18px;
    align-items:stretch;
  }

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px 18px 20px 18px;
    box-shadow:0 2px 10px rgba(28,43,74,0.05);
  }

  .card-head{
    display:flex; align-items:center; gap:8px; margin-bottom:14px;
  }
  .card-head.sub{ margin-top:22px; }
  .head-bar{ width:4px; height:16px; background:var(--navy); border-radius:2px; flex-shrink:0; }
  .card-head h2{ font-size:14.5px; font-weight:800; margin:0; color:var(--navy); }
  .head-meta{ margin-left:auto; font-size:11.5px; color:var(--muted); font-weight:600; }

  /* 좌측: 관측 데이터 테이블 */
  table.info-table{ width:100%; border-collapse:collapse; border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  table.info-table thead th{
    background:var(--accent-soft); color:var(--navy-soft);
    font-size:11.5px; font-weight:700; padding:8px 4px; border-bottom:1px solid var(--border);
  }
  table.info-table td{
    text-align:center; vertical-align:top; padding:16px 8px;
    border-right:1px solid var(--border);
  }
  table.info-table td:last-child{ border-right:none; }
  .temp-icon{ font-size:20px; margin-bottom:4px; }
  .temp-value{ font-size:26px; font-weight:800; color:var(--navy); line-height:1.1; }
  .risk-value{ font-size:26px; font-weight:800; color:var(--danger); line-height:1.1; }
  .temp-sub{ font-size:11px; color:var(--muted); margin-top:4px; }
  .info-cell ul{ list-style:none; margin:0; padding:0; text-align:left; }
  .info-cell li{ font-size:11.5px; color:var(--navy-soft); margin-bottom:8px; display:flex; align-items:center; gap:6px; }
  .info-cell li b{ margin-left:auto; color:var(--navy); font-size:12px; }
  .dot{ width:7px;height:7px;border-radius:50%; flex-shrink:0; }
  .dot.blue{ background:var(--accent); }
  .dot.green{ background:var(--safe); }
  .dot.red{ background:var(--danger); }
  .dot.orange{ background:var(--warn); }

  /* 위험기상정보 스타일 4열 상태표 */
  table.status-table{ width:100%; border-collapse:collapse; table-layout:fixed; }
  table.status-table td{
    text-align:center; padding:10px 4px; border:1px solid var(--border); vertical-align:top;
  }
  .status-label{ font-size:11px; color:var(--muted); font-weight:700; margin-bottom:8px; }
  .status-dot{ width:14px; height:14px; border-radius:50%; margin:0 auto 6px auto; }
  .status-dot.green{ background:var(--safe); box-shadow:0 0 0 4px var(--safe-soft); }
  .status-dot.orange{ background:var(--warn); box-shadow:0 0 0 4px var(--warn-soft); }
  .status-dot.red{ background:var(--danger); box-shadow:0 0 0 4px var(--danger-soft); }
  .status-text{ font-size:12.5px; font-weight:800; color:var(--navy); }
  .status-sub{ font-size:10.5px; color:var(--muted); margin-top:3px; }

  /* 우측: 지도 카드 */
  .right-card{ display:flex; flex-direction:column; min-height:640px; }
  #mapWrap{ position:relative; flex:1; border-radius:10px; overflow:hidden; border:1px solid var(--border); }
  #map{ width:100%; height:100%; min-height:600px; }

  .map-legend{
    position:absolute; left:12px; bottom:12px; z-index:500;
    background:rgba(255,255,255,0.95);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
    font-size:11px;
    color:var(--navy-soft);
    box-shadow:0 2px 8px rgba(0,0,0,0.12);
    max-width:180px;
  }
  .map-legend .lg-title{ font-weight:800; color:var(--navy); margin-bottom:6px; font-size:11.5px; }
  .legend-bar{
    height:8px; border-radius:4px;
    background:linear-gradient(to right, #b3001b, #ff5a5f, #ffb454, #ffe38a, #9be89b, #4fc3f7);
    margin-bottom:4px;
  }
  .legend-scale{ display:flex; justify-content:space-between; font-size:9.5px; color:var(--muted); margin-bottom:8px; }
  .legend-row{ display:flex; align-items:center; gap:6px; margin-top:4px; }
  .legend-dot{ width:10px; height:10px; border-radius:50%; background:var(--danger); border:2px solid #fff; box-shadow:0 0 0 1px var(--danger); flex-shrink:0; }

  .popup-title{ font-weight:800; margin-bottom:4px; color:var(--navy); font-size:13px; }
  .popup-row{ font-size:11.5px; color:var(--navy-soft); margin-bottom:2px; }
  .leaflet-popup-content-wrapper{ border-radius:10px; }
  .leaflet-control-layers{
    border-radius:10px !important;
    border:1px solid var(--border) !important;
    box-shadow:0 2px 8px rgba(0,0,0,0.12) !important;
    font-family:inherit;
    padding:6px 10px !important;
  }
  .leaflet-control-layers label{
    font-size:12.5px; color:var(--navy-soft); font-weight:600;
  }

  @media (max-width:920px){
    .dashboard{ grid-template-columns:1fr; }
    .right-card{ min-height:420px; }
  }
</style>
</head>
<body>
<div class="page">

  <div class="top-bar">
    <div class="brand">
      <span class="brand-badge"></span>
      <div>
        <div class="brand-title" id="brandTitle">도로결빙 위험구간 관측 지도</div>
       
      </div>
    </div>
    <div class="mode-toggle" id="modeToggle">
      <button class="mode-btn active" data-mode="icing" type="button">❄️ 결빙</button>
      <button class="mode-btn" data-mode="heat" type="button">🔥 폭염</button>
    </div>
    <div class="update-time" id="updateTime">관측시각 -</div>
  </div>

  <div class="file-bar">
    <div class="file-controls">
      <label class="file-btn" for="fileInput">+ 관측파일 추가</label>
      <input type="file" id="fileInput" accept=".txt" multiple style="display:none" />
      <button class="run-btn" id="runBtn" disabled>실행</button>
      <button class="reset-btn" id="resetBtn">초기화(데모)</button>
      <span class="file-hint">지점_real / 지점_aws 형식의 txt 관측파일을 추가한 뒤 실행을 누르세요</span>
    </div>
    <div class="file-chips" id="fileChips"></div>
    <div class="file-status" id="fileStatus"></div>
  </div>

  <div class="tools-bar">
    <div class="tool-group" id="icingThresholds">
      <div class="tool-label">임계값 설정 (결빙)</div>
      <div class="tool-row">
        <label>위험 노면온도 ≤ <input type="number" id="thDangerTemp" class="th-input" step="0.1" value="-1">℃</label>
        <label>주의 노면온도 ≤ <input type="number" id="thCautionTemp" class="th-input" step="0.1" value="1">℃</label>
        <label>위험 마찰계수 ≤ <input type="number" id="thFriction" class="th-input" step="0.05" value="0.3"></label>
      </div>
    </div>
    <div class="tool-group" id="heatThresholds" hidden>
      <div class="tool-label">임계값 설정 (폭염)</div>
      <div class="tool-row">
        <label>주의 기온 ≥ <input type="number" id="thHeatCaution" class="th-input" step="0.5" value="33">℃</label>
        <label>위험 기온 ≥ <input type="number" id="thHeatDanger" class="th-input" step="0.5" value="35">℃</label>
      </div>
    </div>
    <div class="tool-group grow">
      <div class="tool-label">시간 재생 <span id="timeLabel">-</span></div>
      <div class="tool-row">
        <input type="range" id="timeSlider" class="time-slider" min="0" max="100" value="100" disabled>
        <button class="reset-btn" id="playBtn">▶ 재생</button>
      </div>
    </div>
    <div class="tool-group">
      <div class="tool-label">&nbsp;</div>
      <button class="run-btn export-btn" id="exportBtn">🖨 인쇄/PDF 저장</button>
    </div>
  </div>

  <div class="dashboard">
    <!-- 왼쪽: 관측 데이터 -->
    <div class="card left-card">
      <div class="card-head">
        <span class="head-bar"></span>
        <h2>관측 데이터</h2>
        <span class="head-meta" id="obsMeta">-</span>
      </div>
      <table class="info-table">
        <thead>
          <tr><th id="thMinTempLabel">최저 노면온도</th><th id="thRiskLabel">결빙 위험구간</th><th>관측 정보</th></tr>
        </thead>
        <tbody>
          <tr>
            <td>
              <div class="temp-icon" id="curMinTempIcon">❄️</div>
              <div class="temp-value" id="curMinTemp">-</div>
              <div class="temp-sub" id="curMinTempSub">노면온도(℃)</div>
            </td>
            <td>
              <div class="temp-icon">⚠️</div>
              <div class="risk-value" id="curRiskCount">-</div>
              <div class="temp-sub">구간 수</div>
            </td>
            <td class="info-cell">
              <ul>
                <li><span class="dot blue"></span>평균온도<b id="curAvgTemp">-</b></li>
                <li><span class="dot blue"></span>관측지점<b id="curTotal">-</b></li>
                <li><span class="dot green"></span><span id="curDistanceLabel">관측거리</span><b id="curDistance">90.7km</b></li>
              </ul>
            </td>
          </tr>
        </tbody>
      </table>

      <div class="card-head sub">
        <span class="head-bar"></span>
        <h2>위험기상정보</h2>
      </div>
      <table class="status-table">
        <tr id="statusRow"></tr>
      </table>

      <div class="card-head sub">
        <span class="head-bar"></span>
        <h2>관측망 커버리지</h2>
      </div>
      <table class="status-table">
        <tr id="coverageRow"></tr>
      </table>
    </div>

    <!-- 오른쪽: 지도 -->
    <div class="card right-card">
      <div class="card-head">
        <span class="head-bar"></span>
        <h2>지도 보기</h2>
        <span class="head-meta">위험구간 클릭 시 상세정보</span>
      </div>
      <div id="mapWrap">
        <div id="map"></div>
        <div class="map-legend">
          <div class="lg-title" id="legendTitle">노면온도</div>
          <div class="legend-bar" id="legendBar"></div>
          <div class="legend-scale" id="legendScale"><span>-3℃</span><span>1℃</span><span>5℃+</span></div>
          <div class="legend-row"><span class="legend-dot" id="legendDot"></span><span id="legendRiskLabel">결빙 위험구간</span></div>
        </div>
      </div>
    </div>
  </div>

</div>

// 결빙 모드: 저온(빨강) -> 고온(파랑) - 노면온도 색상 스케일
const ICE_STOPS = [
  [-3.0, [179, 0, 27]],
  [-1.0, [255, 90, 95]],
  [ 0.0, [255, 180, 84]],
  [ 1.0, [255, 227, 138]],
  [ 3.0, [155, 232, 155]],
  [ 5.2, [79, 195, 247]]
];
// 폭염 모드: 저온(파랑) -> 고온(빨강) - 기온 색상 스케일
const HEAT_STOPS = [
  [20.0, [79, 195, 247]],
  [28.0, [155, 232, 155]],
  [31.0, [255, 227, 138]],
  [33.0, [255, 180, 84]],
  [35.0, [255, 90, 95]],
  [38.0, [179, 0, 27]]
];

function colorFromStops(t, stops){
  if(t <= stops[0][0]) return rgb(stops[0][1]);
  if(t >= stops[stops.length-1][0]) return rgb(stops[stops.length-1][1]);
  for(let i=0;i<stops.length-1;i++){
    const [t0,c0] = stops[i], [t1,c1] = stops[i+1];
    if(t >= t0 && t <= t1){
      const f = (t - t0) / (t1 - t0);
      const c = c0.map((v,k) => Math.round(v + (c1[k]-v)*f));
      return rgb(c);
    }
  }
  return rgb(stops[0][1]);
}
function tempToColor(t){ return colorFromStops(t, ICE_STOPS); }
// 현재 모드(결빙/폭염)에 맞는 색상 스케일 적용
function colorFor(t){ return colorFromStops(t, MODE === 'heat' ? HEAT_STOPS : ICE_STOPS); }
function rgb(c){ return `rgb(${c[0]},${c[1]},${c[2]})`; }

/* ---------- 위험구간 클러스터 ---------- */
function buildRiskClusters(data){
  const clusters = [];
  let cur = null;
  data.forEach(d => {
    if(d.r === 'O'){
      if(!cur) cur = [];
      cur.push(d);
    } else {
      if(cur){ clusters.push(cur); cur = null; }
    }
  });
  if(cur) clusters.push(cur);
  return clusters;
}

function buildSparkline(temps, w, h){
  const pad = 6;
  const min = Math.min(...temps), max = Math.max(...temps);
  const range = (max - min) || 1;
  const stepX = temps.length > 1 ? (w - pad*2) / (temps.length - 1) : 0;
  const pts = temps.map((t,i) => {
    const x = pad + i*stepX;
    const y = h - pad - ((t - min)/range) * (h - pad*2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  const areaPts = `${pad},${h-pad} ` + pts.join(' ') + ` ${w-pad},${h-pad}`;
  return `
    <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
      <polygon points="${areaPts}" fill="#e6484f22"></polygon>
      <polyline points="${pts.join(' ')}" fill="none" stroke="#e6484f" stroke-width="2"></polyline>
    </svg>
  `;
}

// txt 한 줄을 관측소 데이터 객체로 파싱 (지점_real / 지점_aws 공통 포맷)
function parseStationLine(line){
  const parts = line.split(',');
  if(parts.length < 21) return null;
  const time = (parts[0] || '').trim();
  const site = (parts[1] || '').trim();
  if(!time || !site || time === '*' || site === '*') return null;

  const latIntStr = (parts[8] || '').trim();
  const latDecStr = (parts[9] || '').trim();
  const lonIntStr = (parts[10] || '').trim();
  const lonDecStr = (parts[11] || '').trim();
  if(!latIntStr || !latDecStr || !lonIntStr || !lonDecStr) return null;

  const lat = parseFloat(latIntStr) + parseInt(latDecStr, 10) / Math.pow(10, latDecStr.length);
  const lon = parseFloat(lonIntStr) + parseInt(lonDecStr, 10) / Math.pow(10, lonDecStr.length);
  const roadTemp = parseFloat(parts[14]);
  if(!isFinite(lat) || !isFinite(lon) || !isFinite(roadTemp)) return null;
  // GPS 미수신(0,0) 등 대한민국 범위를 벗어난 좌표는 결측치로 간주하고 제외
  if(lat < 30 || lat > 40 || lon < 120 || lon > 135) return null;

  return {
    time, site, lat, lon,
    airTemp: parseFloat(parts[2]),
    roadTemp,
    roadState: (parts[15] || '').trim(),
    friction: parseFloat(parts[16]),
    iceTemp: parseFloat(parts[20])
  };
}

function parseStationFile(text){
  const rows = [];
  const lines = text.split(/\r?\n/);
  for(const raw of lines){
    const line = raw.trim();
    if(!line || line.startsWith('#') || line === '*') continue;
    const row = parseStationLine(line);
    if(row) rows.push(row);
  }
  return rows;
}

// 관측소 원본 row -> 지도 렌더링용 포인트로 변환 (모드/임계값이 바뀌면 위험 여부도 다시 계산됨)
function toRiskPoints(rows){
  return rows.map(row => {
    if(MODE === 'heat'){
      // 폭염 모드: 기온을 기준으로 판정 (기온이 없는 구형 데이터는 노면온도로 대체)
      const heatTemp = isFinite(row.airTemp) ? row.airTemp : row.roadTemp;
      return {
        t: row.time, la: row.lat, lo: row.lon, te: heatTemp,
        r: (heatTemp >= HEAT_DANGER_TEMP) ? 'O' : 'X',
        friction: row.friction, airTemp: row.airTemp, roadTemp: row.roadTemp, roadState: row.roadState
      };
    }
    return {
      t: row.time, la: row.lat, lo: row.lon, te: row.roadTemp,
      r: (row.roadTemp <= DANGER_ROAD_TEMP || (isFinite(row.friction) && row.friction <= DANGER_FRICTION)) ? 'O' : 'X',
      friction: row.friction, airTemp: row.airTemp, roadTemp: row.roadTemp, roadState: row.roadState
    };
  });
}

function haversineKm(a, b){
  const R = 6371;
  const dLat = (b[0]-a[0]) * Math.PI/180;
  const dLon = (b[1]-a[1]) * Math.PI/180;
  const la1 = a[0]*Math.PI/180, la2 = b[0]*Math.PI/180;
  const h = Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

// "YYYY-MM-DD H:MM[:SS]" 형식(데모/실측 공통, 시각 0패딩 없어도 허용)을 안전하게 ms로 변환
function parseTimeMs(t){
  const m = String(t).match(/^(\d{4})-(\d{2})-(\d{2})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
  if(!m) return NaN;
  const [, y, mo, d, h, mi, s] = m;
  return new Date(Number(y), Number(mo)-1, Number(d), Number(h), Number(mi), Number(s || 0)).getTime();
}

// GPS 튐(순간이동) 판정: 두 지점 사이 내재 속도가 비현실적으로 크면 결측/오류 구간으로 간주
const MAX_PLAUSIBLE_KMH = 200;
function isGpsGlitch(a, b, distKm){
  const dtHr = Math.abs(parseTimeMs(b.t) - parseTimeMs(a.t)) / 3600000;
  if(!isFinite(dtHr) || dtHr <= 0) return distKm > 1;
  return (distKm / dtHr) > MAX_PLAUSIBLE_KMH;
}

// 한 이동경로(파일 내 지점 ID)를 그라데이션 선 + 위험구간 클러스터로 그림
function drawRoute(points, locationLabel){
  const locationRow = locationLabel ? `<div class="popup-row">관측 장소: ${locationLabel}</div>` : '';
  let distanceKm = 0;
  const validLatLngs = [];
  for(let i=0;i<points.length-1;i++){
    const a = points[i], b = points[i+1];
    const d = haversineKm([a.la,a.lo], [b.la,b.lo]);
    if(isGpsGlitch(a, b, d)) continue; // GPS 오류로 판단되는 구간은 선을 잇지 않음

    const avgTemp = (a.te + b.te) / 2;
    const isDanger = (a.r === 'O' || b.r === 'O');
    const seg = L.polyline([[a.la,a.lo],[b.la,b.lo]], {
      color: colorFor(avgTemp),
      weight: isDanger ? 7 : 5,
      opacity: isDanger ? 1 : 0.9,
      lineCap: 'round'
    }).addTo(gradientLayer);

    // 지점 클릭 시 해당 지점 전후 구간의 관측값 추이 그래프 표시
    seg.on('click', (e) => {
      const lo = Math.max(0, i - 15), hi = Math.min(points.length, i + 16);
      const windowPts = points.slice(lo, hi);
      const wTemps = windowPts.map(p => p.te);
      const wSpark = buildSparkline(wTemps, 220, 60);
      const primaryLabel = MODE === 'heat' ? '기온' : '노면온도';
      const trendLabel = MODE === 'heat' ? '전후 구간 기온 추이' : '전후 구간 노면온도 추이';
      L.popup({ maxWidth: 260 })
        .setLatLng(e.latlng)
        .setContent(`
          <div class="popup-title">📍 지점 관측값</div>
          ${locationRow}
          <div class="popup-row">관측 시각: ${a.t}</div>
          <div class="popup-row">${primaryLabel}: ${a.te.toFixed(1)}℃${isFinite(a.roadTemp) && MODE === 'heat' ? ' · 노면온도 '+a.roadTemp.toFixed(1)+'℃' : ''}${isFinite(a.airTemp) && MODE !== 'heat' ? ' · 기온 '+a.airTemp.toFixed(1)+'℃' : ''}</div>
          <div class="popup-row">마찰계수: ${isFinite(a.friction) ? a.friction.toFixed(2) : '-'}${a.roadState ? ' · 노면상태코드 '+a.roadState : ''}</div>
          <div class="popup-row" style="margin-top:6px;">${trendLabel}</div>
          ${wSpark}
        `)
        .openOn(map);
    });

    distanceKm += d;
    validLatLngs.push([a.la,a.lo], [b.la,b.lo]);
  }

  const clusters = buildRiskClusters(points);
  clusters.forEach(cluster => {
    const temps = cluster.map(d => d.te);
    const avgTemp = temps.reduce((s,v)=>s+v,0) / temps.length;
    const minTemp = Math.min(...temps);
    const maxTemp = Math.max(...temps);
    const frictions = cluster.map(d => d.friction).filter(isFinite);
    const minFriction = frictions.length ? Math.min(...frictions) : null;
    const startT = cluster[0].t, endT = cluster[cluster.length-1].t;
    const mid = cluster[Math.floor(cluster.length/2)];

    let title, statLine, reason;
    if(MODE === 'heat'){
      title = '🔥 폭염 위험구간';
      reason = '고온';
      statLine = `평균 기온: ${avgTemp.toFixed(1)}℃ · 최고 ${maxTemp.toFixed(1)}℃`;
    } else {
      title = '⚠ 결빙 위험구간';
      reason = minTemp <= DANGER_ROAD_TEMP
        ? '노면온도 저하'
        : (minFriction !== null && minFriction <= DANGER_FRICTION ? '마찰계수 저하(미끄러움)' : '');
      statLine = `평균 노면온도: ${avgTemp.toFixed(1)}℃ · 최저 ${minTemp.toFixed(1)}℃`;
    }

    const segLatLngs = cluster.map(d => [d.la, d.lo]);
    L.polyline(segLatLngs, { color:'#e6484f', weight:7, opacity:1, lineCap:'round' }).addTo(routeLayer);

    const marker = L.circleMarker([mid.la, mid.lo], {
      radius: 7, color: '#ffffff', weight: 2, fillColor: '#e6484f', fillOpacity: 1
    }).addTo(routeLayer);

    const sparkSvg = buildSparkline(temps, 220, 60);
    marker.bindPopup(`
      <div class="popup-title">${title}${reason ? ' · '+reason : ''}</div>
      ${locationRow}
      <div class="popup-row">관측 시각: ${startT} ~ ${endT}</div>
      <div class="popup-row">구간 내 관측지점: ${cluster.length}개</div>
      <div class="popup-row">${statLine}</div>
      ${MODE !== 'heat' ? `<div class="popup-row">최저 마찰계수: ${minFriction !== null ? minFriction.toFixed(2) : '-'}</div>` : ''}
      <div class="popup-row" style="margin-top:6px;">구간 내 ${MODE === 'heat' ? '기온' : '온도'} 변화</div>
      ${sparkSvg}
    `, { maxWidth: 260 });
  });

  return { clusters, distanceKm, validLatLngs };
}

/* ==================================================================
   전체 대시보드 렌더 - 데모/업로드 데이터 공통 진입점
   ================================================================== */
let currentRoutes = [];     // 항상 "전체 시간 범위" 원본 rows 유지 (임계값/슬라이더 변경 시 재사용)
let currentFileNames = [];
let currentMinMs = null, currentMaxMs = null;
let sliderCutoffMs = null;  // null = 전체 구간 표시

function computeCoverage(routes){
  let totalPts = 0, minMs = null, maxMs = null;
  const intervals = [];
  routes.forEach(route => {
    totalPts += route.rows.length;
    let prevMs = null;
    route.rows.forEach(row => {
      const ms = parseTimeMs(row.time);
      if(!isFinite(ms)) return;
      if(minMs === null || ms < minMs) minMs = ms;
      if(maxMs === null || ms > maxMs) maxMs = ms;
      if(prevMs !== null) intervals.push(Math.abs(ms - prevMs));
      prevMs = ms;
    });
  });
  intervals.sort((a,b) => a-b);
  const medianMs = intervals.length ? intervals[Math.floor(intervals.length/2)] : null;
  return { totalPts, minMs, maxMs, medianMs };
}

function formatIntervalMs(ms){
  if(ms === null || !isFinite(ms)) return '-';
  const s = Math.round(ms / 1000);
  if(s < 60) return `약 ${s}초`;
  return `약 ${Math.round(s / 60)}분`;
}

function drawFromRoutes(routes, fileNames){
  gradientLayer.clearLayers();
  routeLayer.clearLayers();

  let allPts = [];
  let allClusters = [];
  let totalDistanceKm = 0;
  let boundsLatLngs = [];

  routes.forEach(route => {
    const points = toRiskPoints(route.rows);
    allPts = allPts.concat(points);
    const { clusters, distanceKm, validLatLngs } = drawRoute(points, route.location);
    allClusters = allClusters.concat(clusters);
    totalDistanceKm += distanceKm;
    boundsLatLngs = boundsLatLngs.concat(validLatLngs);
  });

  lastBoundsLatLngs = boundsLatLngs;
  if(boundsLatLngs.length){
    map.fitBounds(boundsLatLngs, { padding: [24, 24] });
  }

  if(allPts.length === 0){
    document.getElementById('curMinTemp').textContent = '-';
    document.getElementById('curRiskCount').textContent = '0';
    document.getElementById('curAvgTemp').textContent = '-';
    document.getElementById('curTotal').textContent = '0개';
    document.getElementById('curDistance').textContent = '0.0km';
    document.getElementById('updateTime').textContent = '관측시각 -';
    document.getElementById('statusRow').innerHTML = '';
    return;
  }

  let tempSum = 0, tempMin = Infinity, tempMax = -Infinity, minTime = null, maxTime = null;
  allPts.forEach(d => {
    tempSum += d.te;
    if(d.te < tempMin) tempMin = d.te;
    if(d.te > tempMax) tempMax = d.te;
    if(minTime === null || d.t < minTime) minTime = d.t;
    if(maxTime === null || d.t > maxTime) maxTime = d.t;
  });
  const avgTemp = tempSum / allPts.length;
  // 결빙 모드는 "가장 추운 값"이, 폭염 모드는 "가장 더운 값"이 핵심 지표
  const keyTemp = MODE === 'heat' ? tempMax : tempMin;

  document.getElementById('curMinTemp').textContent = keyTemp.toFixed(1) + '℃';
  document.getElementById('curRiskCount').textContent = allClusters.length;
  document.getElementById('curAvgTemp').textContent = avgTemp.toFixed(1) + '℃';
  document.getElementById('curTotal').textContent = allPts.length.toLocaleString() + '개';
  document.getElementById('curDistance').textContent = totalDistanceKm.toFixed(1) + 'km';
  document.getElementById('updateTime').textContent = `관측 ${minTime} ~ ${maxTime} (${allPts.length.toLocaleString()}건)`;

  const locations = Array.from(new Set(routes.map(r => (r.location || '').trim()).filter(Boolean)));
  document.getElementById('obsMeta').textContent = locations.length
    ? locations.join(', ')
    : fileNames.join(', ');

  const isDemo = routes.length && routes[0].site === 'demo';
  const modeSuffix = MODE === 'heat' ? '기온 센서 이동관측(폭염 모드)' : '지면(노면)온도 센서 이동관측';
  const areaLabel = locations.length ? locations.join(', ') : (isDemo ? '강진 구간' : `이동경로 ${routes.length}개`);
  document.getElementById('brandSub').textContent = isDemo
    ? `${areaLabel} · ${modeSuffix}`
    : `${areaLabel} · 업로드 관측파일 · ${modeSuffix}`;

  let keyDot, keyText;
  if(MODE === 'heat'){
    keyDot = keyTemp >= HEAT_DANGER_TEMP ? 'red' : (keyTemp >= HEAT_CAUTION_TEMP ? 'orange' : 'green');
    keyText = keyTemp >= HEAT_DANGER_TEMP ? '위험' : (keyTemp >= HEAT_CAUTION_TEMP ? '주의' : '정상');
  } else {
    keyDot = keyTemp <= DANGER_ROAD_TEMP ? 'red' : (keyTemp <= CAUTION_ROAD_TEMP ? 'orange' : 'green');
    keyText = keyTemp <= DANGER_ROAD_TEMP ? '위험' : (keyTemp <= CAUTION_ROAD_TEMP ? '주의' : '정상');
  }
  const riskDotS = allClusters.length > 0 ? 'red' : 'green';
  const riskTextS = allClusters.length > 0 ? '위험' : '정상';
  const tempColLabel = MODE === 'heat' ? '기온(℃)' : '노면온도(℃)';
  const riskColLabel = MODE === 'heat' ? '폭염위험구간' : '결빙위험구간';

  document.getElementById('statusRow').innerHTML =
    statusColumn(tempColLabel, keyDot, keyText, keyTemp.toFixed(1)+'℃') +
    statusColumn(riskColLabel, riskDotS, riskTextS, allClusters.length+'곳') +
    statusColumn('관측지점', 'green', '정상', allPts.length.toLocaleString()+'개') +
    statusColumn('관측거리', 'green', '정상', totalDistanceKm.toFixed(1)+'km');
}

// 임계값/시간 슬라이더가 바뀔 때마다 currentRoutes를 기준으로 다시 그림
function redraw(){
  let routesToDraw = currentRoutes;
  if(sliderCutoffMs !== null && currentMaxMs !== null && sliderCutoffMs < currentMaxMs){
    routesToDraw = currentRoutes.map(r => ({
      ...r,
      rows: r.rows.filter(row => {
        const ms = parseTimeMs(row.time);
        return isFinite(ms) && ms <= sliderCutoffMs;
      })
    }));
  }
  drawFromRoutes(routesToDraw, currentFileNames);
}

function renderStationDashboard(routes, fileNames){
  currentRoutes = routes;
  currentFileNames = fileNames;
  sliderCutoffMs = null;

  const { totalPts, minMs, maxMs, medianMs } = computeCoverage(routes);
  currentMinMs = minMs;
  currentMaxMs = maxMs;

  if(minMs !== null && maxMs !== null && minMs < maxMs){
    timeSlider.min = String(minMs);
    timeSlider.max = String(maxMs);
    timeSlider.value = String(maxMs);
    timeSlider.disabled = false;
    timeLabel.textContent = formatTimeLabel(maxMs);
  } else {
    timeSlider.disabled = true;
    timeLabel.textContent = '-';
  }

  const routeLocations = Array.from(new Set(routes.map(r => (r.location || '').trim()).filter(Boolean)));
  document.getElementById('coverageRow').innerHTML =
    statusColumn('관측 장소', 'blue', routeLocations.length ? routeLocations.join(', ') : '미입력', '') +
    statusColumn('이동경로', 'blue', routes.length.toLocaleString()+'개', fileNames.length+'개 파일') +
    statusColumn('총 관측건수', 'blue', totalPts.toLocaleString()+'건', '') +
    statusColumn('수집 주기(추정)', 'blue', formatIntervalMs(medianMs), '') +
    statusColumn('관측 기간', 'blue', (minMs !== null && maxMs !== null) ? `${Math.max(1, Math.round((maxMs-minMs)/60000))}분` : '-', '');

  redraw();
}

/* ==================================================================
   임계값 설정 패널
   ================================================================== */
const thDangerTemp = document.getElementById('thDangerTemp');
const thCautionTemp = document.getElementById('thCautionTemp');
const thFriction = document.getElementById('thFriction');
[thDangerTemp, thCautionTemp, thFriction].forEach(el => {
  el.addEventListener('change', () => {
    DANGER_ROAD_TEMP = parseFloat(thDangerTemp.value);
    CAUTION_ROAD_TEMP = parseFloat(thCautionTemp.value);
    DANGER_FRICTION = parseFloat(thFriction.value);
    redraw();
  });
});

const thHeatCaution = document.getElementById('thHeatCaution');
const thHeatDanger = document.getElementById('thHeatDanger');
[thHeatCaution, thHeatDanger].forEach(el => {
  el.addEventListener('change', () => {
    HEAT_CAUTION_TEMP = parseFloat(thHeatCaution.value);
    HEAT_DANGER_TEMP = parseFloat(thHeatDanger.value);
    redraw();
  });
});

/* ==================================================================
   결빙 / 폭염 자동 판단 - 파일을 불러오면 데이터를 분석해 모드를 자동 전환
   ================================================================== */
function detectMode(routes){
  let minRoadTemp = Infinity, maxHeatTemp = -Infinity;
  routes.forEach(route => {
    route.rows.forEach(row => {
      if(isFinite(row.roadTemp) && row.roadTemp < minRoadTemp) minRoadTemp = row.roadTemp;
      const heatTemp = isFinite(row.airTemp) ? row.airTemp : row.roadTemp;
      if(isFinite(heatTemp) && heatTemp > maxHeatTemp) maxHeatTemp = heatTemp;
    });
  });

  // 임계값을 얼마나 넘었는지를 "위험 신호 강도"로 보고, 더 뚜렷한 쪽으로 자동 전환
  const icingScore = isFinite(minRoadTemp) ? (CAUTION_ROAD_TEMP - minRoadTemp) : -Infinity;
  const heatScore = isFinite(maxHeatTemp) ? (maxHeatTemp - HEAT_CAUTION_TEMP) : -Infinity;

  let mode = null;
  if(icingScore > 0 && heatScore > 0){
    mode = icingScore >= heatScore ? 'icing' : 'heat';
  } else if(icingScore > 0){
    mode = 'icing';
  } else if(heatScore > 0){
    mode = 'heat';
  }

  return { mode, minRoadTemp, maxHeatTemp, icingScore, heatScore };
}

/* ==================================================================
   결빙 / 폭염 모드 전환
   ================================================================== */
function applyModeLabels(){
  const heat = MODE === 'heat';
  document.getElementById('brandTitle').textContent = heat
    ? '도로 폭염 위험구간 관측 지도'
    : '도로결빙 위험구간 관측 지도';
  document.getElementById('thMinTempLabel').textContent = heat ? '최고기온' : '최저 노면온도';
  document.getElementById('thRiskLabel').textContent = heat ? '폭염 위험구간' : '결빙 위험구간';
  document.getElementById('curMinTempIcon').textContent = heat ? '🔥' : '❄️';
  document.getElementById('curMinTempSub').textContent = heat ? '기온(℃)' : '노면온도(℃)';
  document.getElementById('legendTitle').textContent = heat ? '기온' : '노면온도';
  document.getElementById('legendRiskLabel').textContent = heat ? '폭염 위험구간' : '결빙 위험구간';
  const scaleStops = heat ? HEAT_STOPS : ICE_STOPS;
  const scaleColors = scaleStops.map(s => rgb(s[1])).join(',');
  document.getElementById('legendBar').style.background = `linear-gradient(to right, ${scaleColors})`;
  document.getElementById('legendScale').innerHTML =
    `<span>${scaleStops[0][0]}℃</span><span>${scaleStops[Math.floor(scaleStops.length/2)][0]}℃</span><span>${scaleStops[scaleStops.length-1][0]}℃+</span>`;

  document.getElementById('icingThresholds').hidden = heat;
  document.getElementById('heatThresholds').hidden = !heat;

  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === MODE);
  });
}

document.getElementById('modeToggle').addEventListener('click', (e) => {
  const btn = e.target.closest('.mode-btn');
  if(!btn || btn.dataset.mode === MODE) return;
  MODE = btn.dataset.mode;
  applyModeLabels();
  redraw();
});

/* ==================================================================
   시간 재생 슬라이더
   ================================================================== */
const timeSlider = document.getElementById('timeSlider');
const timeLabel = document.getElementById('timeLabel');
const playBtn = document.getElementById('playBtn');
let redrawScheduled = false;
let playTimer = null;

function formatTimeLabel(ms){
  const dt = new Date(ms);
  const p = n => String(n).padStart(2,'0');
  return `${dt.getFullYear()}-${p(dt.getMonth()+1)}-${p(dt.getDate())} ${p(dt.getHours())}:${p(dt.getMinutes())}:${p(dt.getSeconds())}`;
}

// requestAnimationFrame은 백그라운드/비활성 탭에서 지연될 수 있어 setTimeout 기반으로 스로틀
function scheduleRedraw(){
  if(redrawScheduled) return;
  redrawScheduled = true;
  setTimeout(() => { redrawScheduled = false; redraw(); }, 80);
}

timeSlider.addEventListener('input', () => {
  sliderCutoffMs = Number(timeSlider.value);
  timeLabel.textContent = formatTimeLabel(sliderCutoffMs);
  scheduleRedraw();
});

playBtn.addEventListener('click', () => {
  if(playTimer){
    clearInterval(playTimer);
    playTimer = null;
    playBtn.textContent = '▶ 재생';
    return;
  }
  if(timeSlider.disabled) return;
  const min = Number(timeSlider.min), max = Number(timeSlider.max);
  if(max <= min) return;
  playBtn.textContent = '⏸ 정지';
  const stepMs = Math.max(1000, Math.round((max - min) / 150)); // 약 150단계로 재생
  if(Number(timeSlider.value) >= max) timeSlider.value = String(min);
  playTimer = setInterval(() => {
    let v = Number(timeSlider.value) + stepMs;
    if(v >= max){
      v = max;
      clearInterval(playTimer);
      playTimer = null;
      playBtn.textContent = '▶ 재생';
    }
    timeSlider.value = String(v);
    sliderCutoffMs = v;
    timeLabel.textContent = formatTimeLabel(v);
    redraw();
  }, 200);
});

/* ==================================================================
   인쇄 / PDF 저장 (보고서·홍보자료용)
   ================================================================== */
document.getElementById('exportBtn').addEventListener('click', () => { window.print(); });

/* ==================================================================
   실행 버튼 - 추가된 파일을 파싱해 이동경로 단위로 묶어 렌더링
   ================================================================== */
runBtn.addEventListener('click', () => {
  if(pendingFiles.length === 0) return;

  const siteMap = new Map(); // "파일명::지점ID" -> {site, fileName, location, rows[]}
  const fileNames = [];
  let totalRows = 0;
  let hadError = false;

  pendingFiles.forEach(f => {
    const rows = parseStationFile(f.text);
    totalRows += rows.length;
    fileNames.push(f.name);
    const chip = fileChipsEl.querySelector(`.file-chip[data-id="${f.id}"]`);
    if(rows.length === 0){
      hadError = true;
      if(chip) chip.classList.add('error');
      return;
    }
    if(chip) chip.classList.add('applied');
    const location = (f.location || '').trim();
    // 같은 지점 ID라도 파일이 다르면(샘플링 주기가 달라 시간이 어긋날 수 있음) 별도 경로로 취급
    rows.forEach(r => {
      const key = f.name + '::' + r.site;
      if(!siteMap.has(key)) siteMap.set(key, { site: r.site, fileName: f.name, location, rows: [] });
      siteMap.get(key).rows.push(r);
    });
  });

  if(siteMap.size === 0){
    fileStatusEl.textContent = '유효한 관측 데이터를 찾지 못했습니다. 파일 형식을 확인해주세요.';
    return;
  }

  const routes = Array.from(siteMap.values()).map(({ site, fileName, location, rows }) => {
    rows.sort((a, b) => a.time < b.time ? -1 : (a.time > b.time ? 1 : 0));
    return { site, fileName, location, rows };
  });
  const totalPts = routes.reduce((s, r) => s + r.rows.length, 0);

  // 데이터를 분석해 결빙/폭염 위험 신호를 자동 판단하고 해당 모드로 전환
  const detected = detectMode(routes);
  let detectMsg;
  if(detected.mode === 'heat'){
    detectMsg = `🔥 폭염 위험 신호 감지(최고 ${detected.maxHeatTemp.toFixed(1)}℃) → 폭염 모드로 전환했습니다.`;
  } else if(detected.mode === 'icing'){
    detectMsg = `❄️ 결빙 위험 신호 감지(최저 ${detected.minRoadTemp.toFixed(1)}℃) → 결빙 모드로 전환했습니다.`;
  } else {
    detectMsg = `결빙·폭염 위험 신호가 감지되지 않았습니다(최저 ${isFinite(detected.minRoadTemp) ? detected.minRoadTemp.toFixed(1) : '-'}℃ · 최고 ${isFinite(detected.maxHeatTemp) ? detected.maxHeatTemp.toFixed(1) : '-'}℃). 결빙 모드로 표시합니다.`;
  }
  MODE = detected.mode || 'icing';
  applyModeLabels();

  renderStationDashboard(routes, fileNames);

  const loadMsg = hadError
    ? `일부 파일에서 유효한 데이터를 찾지 못했습니다. (이동경로 ${routes.length}개, 총 ${totalPts.toLocaleString()}건 반영)`
    : `이동경로 ${routes.length}개, 총 ${totalPts.toLocaleString()}건 반영 완료.`;
  fileStatusEl.textContent = `${loadMsg} ${detectMsg}`;
});

/* ==================================================================
   초기 화면 - 데모(이동관측) 데이터로 렌더링
   ================================================================== */
const demoRoutes = [{
  site: 'demo',
  fileName: 'demo',
  rows: RAW_DATA.map(d => ({
    time: d.t, site: 'demo', lat: d.la, lon: d.lo,
    roadTemp: d.te, friction: NaN, airTemp: NaN, roadState: ''
  }))
}];
applyModeLabels();
renderStationDashboard(demoRoutes, ['데모 데이터 (2026-01-16 새벽)']);
</script>
